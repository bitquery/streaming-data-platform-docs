# --- Legacy URL map: server-side 301s for the Sept 2025 restructure ---
# The /docs/examples/<chain>/... tree moved to /docs/blockchain/<Chain>/... on
# 2025-09-08 with browser-side redirects only (plugin-client-redirects emits a
# 200 page carrying a meta refresh). Search Console lists 302 of those URLs as
# "page with redirect", 59 old paths as 404 and the old section hubs as 403.
# This map turns every known old path into a real 301.
# Sources: the plugin-client-redirects list in docusaurus.config.js plus every
# docs/ rename in git since 2025-08-01; every target was checked against the
# live sitemap on 2026-09-05 and chains were collapsed to the final page.
# Keys match $uri ignoring case (nginx map semantics); both slash forms are listed.
# The hash settings must come before the map: the default bucket (64 bytes)
# cannot hold keys longer than about 50 characters.
map_hash_max_size 4096;
map_hash_bucket_size 128;
map $uri $legacy_redirect {
    default "";
    "/docs/authorisation/" "/docs/authorization/how-to-generate/";
    "/docs/authorisation" "/docs/authorization/how-to-generate/";
    "/docs/authorisation/how-to-generate/" "/docs/authorization/how-to-generate/";
    "/docs/authorisation/how-to-generate" "/docs/authorization/how-to-generate/";
    "/docs/authorisation/how-to-use/" "/docs/authorization/how-to-use/";
