server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Behind TLS termination nginx sees plain http; emit relative Location headers
    # so 301s keep the client's https scheme (no extra http->https upgrade hop).
    absolute_redirect off;

    # --- Compression (WP-0.1) ---
    # The base image gzips text/html only; add JS/CSS/SVG/JSON so bundles ship
    # compressed. Brotli is intentionally NOT enabled: nginx:stable-alpine ships
    # without the brotli module, so `brotli on;` would fail to start. To add
    # brotli, build a custom nginx image with ngx_brotli and re-add here.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain application/x-protobuf;

    # --- Server-side 301 redirects (WP-0.3) ---
    # Ported from the (Netlify-only, never-executed) static/_redirects plus two
    # gaps proven live: /blog with no trailing slash, and the old PumpFun casing.

    # Stale docs blog → main site blog
    location /blog/ {
        return 301 https://bitquery.io/blog/;
    }
    # /blog without a trailing slash previously fell through to the SPA fallback
    # and soft-404'd; send it to the same place as /blog/.
    location = /blog {
        return 301 https://bitquery.io/blog/;
    }

    # Old PumpFun casing (Google-indexed; went dead when the dir was renamed to
    # Pumpfun). `^~` is a CASE-SENSITIVE prefix match, so correctly-cased
    # /Pumpfun/ URLs never enter this block — no redirect loop.
    location ^~ /docs/blockchain/Solana/PumpFun {
        rewrite ^/docs/blockchain/Solana/PumpFun(/.*)?$ /docs/blockchain/Solana/Pumpfun$1 permanent;
    }

    # Legacy MCP path (was a client-side redirect only)
    location = /docs/usecases/MCP  { return 301 /docs/mcp/mcp-server/; }
    location = /docs/usecases/MCP/ { return 301 /docs/mcp/mcp-server/; }

    # Legacy Pump.fun paths. These are covered by plugin-client-redirects, which
    # emits a real HTML page per old URL: HTTP 200, a meta-refresh, a *relative*
    # canonical — and an EMPTY <title>. Verified live on 2026-08-11, all four
    # sampled paths returned `200` with `<title></title>`. Nine such URLs exist
    # for a four-page cluster, and Google indexed them: on 2026-08-09
    # /docs/examples/Solana/Pump-Fun-API/ ranked position 3 for "pumpfun api",
    # above the canonical page, which was position 13.4 the same day.
    #
    # A 200 with no title is an indexable duplicate, so the client-side redirect
    # is actively competing with the page it points at. Promote to real 301s;
    # the client-side redirects stay as a harmless fallback for direct hits that
    # somehow bypass nginx.
    #
    # No redirect loop: the canonical form is /docs/blockchain/Solana/Pumpfun/<page>,
    # and the capture group below matches only the bare <page> names, never a
    # "Pumpfun/<page>" segment, so targets cannot re-enter this block. The
    # ^~ /docs/blockchain/Solana/PumpFun block above does not shadow these
    # either — "PumpFun" is not a prefix of "Pump-Fun-API" or "pump-swap-api".
    location ~ ^/docs/(?:examples/Solana|examples/dextrades|blockchain/Solana)/(Pump-Fun-API|Pump-Fun-Marketcap-Bonding-Curve-API|pump-fun-to-pump-swap|pump-swap-api)/?$ {
        return 301 /docs/blockchain/Solana/Pumpfun/$1/;
    }

    # Auto-generated GraphQL Reference (docs/graphql-reference/), removed 1 Sep 2026.
    # 485 schema pages superseded by /docs/schema/. They were sitemap-excluded but
    # still live URLs, so catch the whole tree server-side; the client-side redirect
    # for the bare /docs/graphql-reference/ root stays as a fallback.
    location ^~ /docs/graphql-reference {
        return 301 /docs/schema/schema-intro/;
    }

    # Self-hosted fonts + webpack-hashed /assets (filenames change on update)
    location ~* ^/(fonts|assets)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # Raw markdown twins (/docs/**/index.md) emitted by plugins/llms-txt.js for
    # LLM/agent consumption. nginx has no mime type for .md, so they were served
    # as application/octet-stream — browsers download them instead of displaying,
    # and some crawlers skip non-text types.
    location ~ \.md$ {
        default_type text/markdown;
        charset utf-8;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # Doc images/videos are updated in place — cache hard but allow revalidation
    location /img/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # --- Real 404s (WP-0.2) ---
    # The site is a fully static Docusaurus export (every route is a real
    # index.html, and build/404.html exists). Serve that with a genuine 404
    # status instead of the old `try_files ... /index.html` SPA fallback, which
    # returned 200 + the homepage shell for every unknown URL (site-wide soft-404).
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }
}
