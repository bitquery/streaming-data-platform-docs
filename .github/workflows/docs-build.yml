name: Docs build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check internal links
        run: node scripts/check-links.mjs
      # nginx/default.conf ships straight into the runtime image (see Dockerfile)
      # and was never validated anywhere in CI. A syntax error there does not fail
      # the build — it fails `nginx -g daemon off;` at container start, i.e. the
      # docs go down on deploy. Validate it with the same nginx the image uses.
      - name: Validate nginx config
        run: |
          docker run --rm \
            -v "$PWD/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:stable-alpine nginx -t
      # IndexNow: tell Bing (and the engines and assistants that read its index,
      # ChatGPT search included) which pages changed, instead of waiting for a
      # recrawl. Google ignores it; the sitemap covers Google. Runs only on
      # merges to main; the deploy that follows this build lands minutes later.
      - name: Submit changed URLs to IndexNow
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: node scripts/indexnow-submit.js --since "${{ github.event.before }}"
